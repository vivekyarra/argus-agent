[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "argus-agent"
version = "2.1.0"
description = "Ambient AI Screen Intelligence Agent powered by Gemini 2.0 Flash Vision"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Vivek Yarra"},
]
keywords = ["ai", "agent", "screen-intelligence", "gemini", "vision", "ambient"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "google-generativeai>=0.8.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-firestore>=2.16.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "websockets>=13.0",
    "Pillow>=10.4.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
client = [
    "mss>=9.0.0",
    "pyautogui>=0.9.54",
    "SpeechRecognition>=3.10.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/vivekyarra/argus-agent"
Repository = "https://github.com/vivekyarra/argus-agent"
Documentation = "https://github.com/vivekyarra/argus-agent/tree/main/docs"
Issues = "https://github.com/vivekyarra/argus-agent/issues"

# ── Pytest ────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "security: marks security-focused tests",
]
asyncio_mode = "auto"

# ── Coverage ──────────────────────────────────────────────────
[tool.coverage.run]
source = ["backend", "client"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/conftest.py",
    "client/argus_client.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 75
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "except ImportError",
]

[tool.coverage.html]
directory = "htmlcov"

# ── Mypy ──────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

# ── Ruff ──────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "B",    # flake8-bugbear
    "ANN",  # flake8-annotations
]
ignore = ["D100", "D104", "ANN101", "ANN102", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"
